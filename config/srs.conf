listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

stats {
    network         0;
}

rtc_server {
    enabled         on;
    listen          8000;
    # ICE candidate advertised to viewers = the server's LAN IP (set by server/up.sh)
    candidate       $CANDIDATE;
}

vhost __defaultVhost__ {
    tcp_nodelay     on;
    min_latency     on;

    play {
        gop_cache       off;
        queue_length    10;
        mw_latency      10;
    }

    publish {
        mr off;
    }

    # Forward identical RTMP stream over loopback to MediaMTX for Apple LL-HLS (#EXT-X-PART)
    forward {
        enabled on;
        destination 127.0.0.1:1936;
    }

    # HTTP-FLV live streaming
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    # Standard low-latency HLS (backup/reference on :8080)
    hls {
        enabled         on;
        hls_fragment    1;
        hls_window      6;
        hls_path        ./objs/nginx/html;
    }

    # WebRTC (RTMP -> WebRTC SFU)
    rtc {
        enabled     on;
        rtmp_to_rtc on;
        rtc_to_rtmp off;
        nack        on;
        twcc        on;
        pli_for_rtmp 1.0;
    }
}
